name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y yarn@1.22.22 install --frozen-lockfile
      - run: npx -y yarn@1.22.22 lint
      - name: Unit tests with the 90% coverage gate
        run: npx -y yarn@1.22.22 test
      - run: npx next build
